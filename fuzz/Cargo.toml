# cargo-fuzz harness for the parse and recovery paths. Run with:
#   cargo +nightly fuzz run page_parse
#   cargo +nightly fuzz run allocator_open
# This is a standalone crate (its own `[workspace]`) so the main package's
# `cargo build`/`clippy`/`test` never pull it in.
[package]
name = "page-db-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
page-db = { path = ".." }

[[bin]]
name = "page_parse"
path = "fuzz_targets/page_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "allocator_open"
path = "fuzz_targets/allocator_open.rs"
test = false
doc = false
bench = false

[workspace]
