[package]
name    = "page-db"
version = "0.5.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "The paging substrate beneath B-tree and heap storage engines - fixed-size pages, CRC32 headers with LSN slots, an LRU buffer pool with dirty-page pinning, and cross-platform Direct I/O."

# Keywords (5 max)
keywords = [
    "page",
    "buffer-pool",
    "paging",
    "storage-engine",
    "direct-io"
]

# Categories
categories = [
    "database-implementations",
    "filesystem"
]

# Links
homepage      = "https://github.com/jamesgober/page-db"
repository    = "https://github.com/jamesgober/page-db"
documentation = "https://docs.rs/page-db"

# Authors
authors = [
    "James Gober <me@jamesgober.com>"
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "page_db"
path = "src/lib.rs"

# `--cfg loom` swaps in loom's instrumented concurrency primitives for the
# buffer-pool model checks; declare it so the compiler does not flag it.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }


# FEATURE FLAGS
# #################################
[features]
default = []
# Serde derives for the small public value types (PageId, Lsn, PageSize).
serde = ["dep:serde"]


# DEPENDENCIES
# #################################
[dependencies]
# Typed, source-preserving error variants for a library crate (REPS: thiserror for libs).
thiserror = "2"
serde = { version = "1", optional = true, default-features = false, features = ["derive"] }

# O_DIRECT, F_NOCACHE, and F_FULLFSYNC are not exposed by std; libc is the
# standard Unix platform-abstraction crate (REPS endorses it over raw FFI).
[target.'cfg(unix)'.dependencies]
libc = "0.2"


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1"
tempfile  = "3"

[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"


# BENCHMARKS
# #################################
[[bench]]
name    = "page_bench"
harness = false


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
